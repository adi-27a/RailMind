services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-railmind}
      POSTGRES_USER: ${POSTGRES_USER:-railmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-railmind}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./database/seeds/001_demo_seed.sql:/docker-entrypoint-initdb.d/002_demo_seed.sql:ro
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  ml:
    build: ./services/ml
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 3000
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://${POSTGRES_USER:-railmind}:${POSTGRES_PASSWORD:-railmind}@postgres:5432/${POSTGRES_DB:-railmind}
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml:8000
      RAILWAY_PROVIDER: ${RAILWAY_PROVIDER:-simulation}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-simulation}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-}
      AUTH_DEMO_EMAIL: ${AUTH_DEMO_EMAIL:-}
      AUTH_DEMO_PASSWORD: ${AUTH_DEMO_PASSWORD:-}
      AUTH_DEMO_ROLE: ${AUTH_DEMO_ROLE:-ADMIN}
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      ml: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["5173:80"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
